name: Build and deploy Node.js app to Azure Web App - PITCH-backend

on:
  push:
    branches:
      - backend
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_62F6E6D4CB9E4E1D8C20521539CB3351 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_19A9DD0473794F56A6F4128E86C2E570 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AC3787B04EFD4004A2BDA5EE813257FA }}

      - name: Install FFmpeg and Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'PITCH-backend'
          slot-name: 'Production'
          package: .
          # Custom command to install FFmpeg via Kudu
          startup-command: 'apt-get update && apt-get install -y ffmpeg && npm start'

      - name: Logout from Azure
        run: az logout