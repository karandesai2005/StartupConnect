name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - backend
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: Production
      url: ${{ steps.check-env-url.outputs.webapp-url }}

    permissions:
      contents: read

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Set Node.js version (stable for Elastic Beanstalk)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'

      # 3️⃣ Install dependencies
      - name: Install dependencies
        run: npm install

      # 4️⃣ Build (if present)
      - name: Build
        run: npm run build --if-present

      # 5️⃣ Test (if present)
      - name: Test
        run: npm test --if-present

      # 6️⃣ Package application (exclude junk + mobile)
      - name: Package application
        run: |
          zip -r app.zip . \
            -x "*.git*" \
            -x "node_modules/*" \
            -x "android/*" \
            -x "ios/*"

      # 7️⃣ Configure AWS credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      # 8️⃣ Deploy to Elastic Beanstalk
      - name: Deploy to Elastic Beanstalk
        run: |
          VERSION_LABEL="${GITHUB_SHA::8}-$(date +%s)"

          echo "Uploading bundle to S3..."
          aws s3 cp app.zip s3://elasticbeanstalk-eu-north-1-655356399713/app-$VERSION_LABEL.zip

          echo "Creating application version..."
          aws elasticbeanstalk create-application-version \
            --application-name pitch-backend \
            --version-label "$VERSION_LABEL" \
            --source-bundle S3Bucket="elasticbeanstalk-eu-north-1-655356399713",S3Key="app-$VERSION_LABEL.zip"

          echo "Updating environment..."
          aws elasticbeanstalk update-environment \
            --environment-name Pitch-backend-env \
            --version-label "$VERSION_LABEL"

      # 9️⃣ Output environment URL
      - name: Check Environment URL
        id: check-env-url
        run: |
          echo "webapp-url=https://pitch-backend-env.eba-wbunutja.eu-north-1.elasticbeanstalk.com" >> $GITHUB_OUTPUT
