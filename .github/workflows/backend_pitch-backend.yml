name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - backend
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: 'Production'
      url: ${{ steps.check-env-url.outputs.webapp-url }}
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: |
          npm install
        working-directory: backend

      - name: Build (if applicable)
        run: |
          npm run build --if-present
        working-directory: backend

      - name: Test (if applicable)
        run: |
          npm run test --if-present
        working-directory: backend

      - name: Package application
        run: |
          zip -r app.zip . -x "*.git*"
        working-directory: backend

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Deploy to Elastic Beanstalk
        id: deploy-to-beanstalk
        run: |
          aws s3 cp app.zip s3://elasticbeanstalk-ap-south-1-940420095386/app-$GITHUB_SHA.zip
          aws elasticbeanstalk create-application-version --application-name pitch-backend --version-label $GITHUB_SHA --source-bundle S3Bucket="elasticbeanstalk-ap-south-1-940420095386",S3Key="app-$GITHUB_SHA.zip"
          aws elasticbeanstalk update-environment --environment-name Pitch-backend-env --version-label $GITHUB_SHA
        env:
          AWS_REGION: ap-south-1

      - name: Check Environment URL
        id: check-env-url
        run: |
          echo "webapp-url=https://Pitch-backend-env.eba-4n4stnmn.ap-south-1.elasticbeanstalk.com" >> $GITHUB_OUTPUT